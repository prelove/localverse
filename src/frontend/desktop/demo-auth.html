<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication Demo - Localverse</title>
  <link rel="stylesheet" href="../../assets/css/auth.css">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
    
    .demo-controls {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      z-index: 1000;
    }
    
    .demo-controls h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #1a202c;
    }
    
    .demo-controls button {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 13px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .demo-controls button:last-child {
      margin-bottom: 0;
    }
    
    .demo-controls button:hover {
      background: #5a67d8;
    }
    
    .user-info {
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      padding: 15px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 12px;
    }
    
    .user-info pre {
      margin: 5px 0 0 0;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="demo-controls">
    <h3>🎮 Demo Controls</h3>
    <button onclick="showSetup()">Show Setup UI</button>
    <button onclick="checkAuth()">Check Auth Status</button>
    <button onclick="logout()">Logout</button>
    <div id="userInfo" class="user-info" style="display: none;">
      <strong>Current User:</strong>
      <pre id="userInfoContent"></pre>
    </div>
  </div>
  
  <div id="app"></div>
  
  <script type="module">
    import { authService } from '../../services/auth/auth-service.js';
    import { SetupUI } from '../../services/auth/setup-ui.js';
    
    const appContainer = document.getElementById('app');
    const userInfo = document.getElementById('userInfo');
    const userInfoContent = document.getElementById('userInfoContent');
    
    // Make functions available globally for demo buttons
    window.showSetup = showSetup;
    window.checkAuth = checkAuth;
    window.logout = logout;
    
    // Initialize
    init();
    
    async function init() {
      const user = await authService.authenticate();
      
      if (user) {
        showMainApp(user);
      } else {
        showSetup();
      }
    }
    
    function showSetup() {
      appContainer.innerHTML = '';
      const setupUI = new SetupUI(appContainer);
      setupUI.render();
      
      setupUI.setOnComplete(async (userData) => {
        try {
          const user = await authService.setup(userData);
          console.log('Setup completed:', user);
          showMainApp(user);
        } catch (error) {
          console.error('Setup failed:', error);
          throw error;
        }
      });
      
      userInfo.style.display = 'none';
    }
    
    function showMainApp(user) {
      appContainer.innerHTML = `
        <div class="setup-container">
          <div class="setup-card">
            <div class="setup-header">
              <h1>✅ 认证成功！</h1>
              <p>欢迎使用 Localverse</p>
            </div>
            
            <div style="padding: 20px; background: #f7fafc; border-radius: 8px; margin-bottom: 20px;">
              <h3 style="margin: 0 0 15px 0; color: #2d3748;">用户信息</h3>
              <div style="font-size: 14px; line-height: 1.8;">
                <p><strong>工号:</strong> ${user.id}</p>
                <p><strong>姓名:</strong> ${user.name}</p>
                <p><strong>部门:</strong> ${user.department}</p>
                <p><strong>角色:</strong> ${user.role}</p>
                <p><strong>设备ID:</strong> ${user.deviceId}</p>
              </div>
            </div>
            
            <div style="font-size: 14px; color: #718096; text-align: center;">
              <p>使用右侧的 Demo Controls 测试不同功能</p>
            </div>
          </div>
        </div>
      `;
      
      // Update user info panel
      userInfoContent.textContent = JSON.stringify(user, null, 2);
      userInfo.style.display = 'block';
    }
    
    async function checkAuth() {
      const user = authService.getCurrentUser();
      
      if (user) {
        alert('已认证\n\n' + JSON.stringify(user, null, 2));
      } else {
        alert('未认证');
      }
      
      // Also check token
      const token = await authService.getToken();
      console.log('Current token:', token);
    }
    
    async function logout() {
      if (confirm('确定要退出登录吗？')) {
        await authService.logout();
        alert('已退出登录');
        showSetup();
      }
    }
  </script>
</body>
</html>
