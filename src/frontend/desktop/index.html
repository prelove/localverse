<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Localverse - 企业级内网操作系统">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Localverse">
  <title>Localverse</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Styles -->
  <link rel="stylesheet" href="themes/variables.css">
  <link rel="stylesheet" href="style.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash" class="splash">
    <div class="splash-content">
      <div class="splash-logo">🌐</div>
      <h1 class="splash-title">Localverse</h1>
      <div class="splash-loader">
        <div class="loader-bar"></div>
      </div>
      <p class="splash-status">正在启动...</p>
    </div>
  </div>

  <!-- Main App Container -->
  <div id="app" class="app"></div>

  <!-- Scripts -->
  <script src="app.bundle.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          // Service worker registration failed (e.g. file:// protocol) — continue without it
        });
      });
    }
  </script>
</body>
</html>
