<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Process Engine Demo - Localverse</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.2em;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      margin-bottom: 16px;
      color: #333;
      font-size: 1.5em;
    }

    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      flex: 1;
      min-width: 200px;
    }

    button.primary {
      background: #667eea;
      color: white;
    }

    button.primary:hover {
      background: #5a67d8;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(102, 126, 234, 0.4);
    }

    button.secondary {
      background: #48bb78;
      color: white;
    }

    button.secondary:hover {
      background: #38a169;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(72, 187, 120, 0.4);
    }

    button.danger {
      background: #f56565;
      color: white;
    }

    button.danger:hover {
      background: #e53e3e;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(245, 101, 101, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .status-panel {
      background: #f7fafc;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      max-height: 400px;
      overflow-y: auto;
    }

    .process-item {
      background: white;
      border-left: 4px solid #667eea;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 4px;
    }

    .process-item.completed {
      border-left-color: #48bb78;
    }

    .process-item.failed {
      border-left-color: #f56565;
    }

    .process-item.running {
      border-left-color: #ed8936;
    }

    .process-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .process-name {
      font-weight: 600;
      color: #2d3748;
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-badge.pending {
      background: #edf2f7;
      color: #4a5568;
    }

    .status-badge.running {
      background: #feebc8;
      color: #c05621;
    }

    .status-badge.completed {
      background: #c6f6d5;
      color: #22543d;
    }

    .status-badge.failed {
      background: #fed7d7;
      color: #742a2a;
    }

    .task-list {
      margin-top: 8px;
      padding-left: 20px;
      font-size: 14px;
      color: #4a5568;
    }

    .task-item {
      padding: 4px 0;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s ease;
    }

    .log {
      background: #2d3748;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 16px;
    }

    .log-entry {
      padding: 2px 0;
    }

    .log-entry .time {
      color: #a0aec0;
    }

    .log-entry .success {
      color: #48bb78;
    }

    .log-entry .error {
      color: #f56565;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔄 Process Engine Demo</h1>
      <p>Localverse Mock Process Engine - Workflow Orchestration</p>
    </div>

    <div class="card">
      <h2>Start Process</h2>
      <div class="button-group">
        <button class="primary" onclick="startSequential()">
          📋 Simple Sequential
        </button>
        <button class="primary" onclick="startParallel()">
          ⚡ Parallel Tasks
        </button>
        <button class="primary" onclick="startConditional()">
          🔀 Conditional Flow
        </button>
      </div>
    </div>

    <div class="card">
      <h2>Process Management</h2>
      <div class="button-group">
        <button class="secondary" onclick="refreshProcesses()">
          🔄 Refresh List
        </button>
        <button class="danger" onclick="cancelAll()">
          ⛔ Cancel All Running
        </button>
      </div>
    </div>

    <div class="card">
      <h2>Active Processes</h2>
      <div class="status-panel" id="processList">
        <p style="text-align: center; color: #a0aec0;">No processes yet. Start one above!</p>
      </div>
    </div>

    <div class="card">
      <h2>Console Log</h2>
      <div class="log" id="console"></div>
    </div>
  </div>

  <script src="./process-service.js"></script>
  <script>
    const processService = new ProcessService();
    const activeProcesses = new Map();

    function log(message, type = 'info') {
      const console = document.getElementById('console');
      const time = new Date().toLocaleTimeString();
      const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
      
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="time">[${time}]</span> <span class="${className}">${message}</span>`;
      
      console.appendChild(entry);
      console.scrollTop = console.scrollHeight;
    }

    async function startSequential() {
      try {
        log('Starting simple sequential process...', 'info');
        const instanceId = await processService.startProcess('simple-sequential');
        log(`✓ Process started: ${instanceId}`, 'success');
        
        monitorProcess(instanceId);
      } catch (error) {
        log(`✗ Error: ${error.message}`, 'error');
      }
    }

    async function startParallel() {
      try {
        log('Starting parallel tasks process...', 'info');
        const instanceId = await processService.startProcess('parallel-tasks');
        log(`✓ Process started: ${instanceId}`, 'success');
        
        monitorProcess(instanceId);
      } catch (error) {
        log(`✗ Error: ${error.message}`, 'error');
      }
    }

    async function startConditional() {
      try {
        log('Starting conditional flow process...', 'info');
        const shouldExecute = Math.random() > 0.5;
        const instanceId = await processService.startProcess('conditional-flow', {
          shouldExecute
        });
        log(`✓ Process started: ${instanceId} (shouldExecute=${shouldExecute})`, 'success');
        
        monitorProcess(instanceId);
      } catch (error) {
        log(`✗ Error: ${error.message}`, 'error');
      }
    }

    async function monitorProcess(instanceId) {
      const updateProcess = (process) => {
        activeProcesses.set(instanceId, process);
        renderProcesses();
        
        const progress = ProcessService.calculateProgress(process);
        log(`Process ${instanceId.slice(0, 8)}: ${progress}% complete`, 'info');
      };

      try {
        const finalProcess = await processService.pollUntilComplete(instanceId, 300, updateProcess);
        
        if (finalProcess.status === 'COMPLETED') {
          log(`✓ Process ${instanceId.slice(0, 8)} completed successfully`, 'success');
        } else if (finalProcess.status === 'FAILED') {
          log(`✗ Process ${instanceId.slice(0, 8)} failed: ${finalProcess.error}`, 'error');
        } else if (finalProcess.status === 'CANCELLED') {
          log(`⚠ Process ${instanceId.slice(0, 8)} was cancelled`, 'info');
        }
      } catch (error) {
        log(`✗ Monitoring error: ${error.message}`, 'error');
      }
    }

    async function refreshProcesses() {
      try {
        log('Refreshing process list...', 'info');
        const processes = await processService.listProcesses();
        
        activeProcesses.clear();
        processes.forEach(p => activeProcesses.set(p.instanceId, p));
        
        renderProcesses();
        log(`✓ Loaded ${processes.length} processes`, 'success');
      } catch (error) {
        log(`✗ Error refreshing: ${error.message}`, 'error');
      }
    }

    async function cancelProcess(instanceId) {
      try {
        log(`Cancelling process ${instanceId.slice(0, 8)}...`, 'info');
        const success = await processService.cancelProcess(instanceId);
        
        if (success) {
          log(`✓ Process cancelled`, 'success');
          await refreshProcesses();
        } else {
          log(`⚠ Could not cancel process`, 'info');
        }
      } catch (error) {
        log(`✗ Error cancelling: ${error.message}`, 'error');
      }
    }

    async function cancelAll() {
      const running = Array.from(activeProcesses.values())
        .filter(p => p.status === 'RUNNING');
      
      if (running.length === 0) {
        log('⚠ No running processes to cancel', 'info');
        return;
      }

      log(`Cancelling ${running.length} running processes...`, 'info');
      
      for (const process of running) {
        await cancelProcess(process.instanceId);
      }
    }

    function renderProcesses() {
      const listEl = document.getElementById('processList');
      const processes = Array.from(activeProcesses.values())
        .sort((a, b) => new Date(b.startTime) - new Date(a.startTime));

      if (processes.length === 0) {
        listEl.innerHTML = '<p style="text-align: center; color: #a0aec0;">No processes yet. Start one above!</p>';
        return;
      }

      listEl.innerHTML = processes.map(p => {
        const progress = ProcessService.calculateProgress(p);
        const statusClass = p.status.toLowerCase();
        
        return `
          <div class="process-item ${statusClass}">
            <div class="process-header">
              <div class="process-name">${p.name}</div>
              <span class="status-badge ${statusClass}">${p.status}</span>
            </div>
            <div style="font-size: 12px; color: #718096;">
              ID: ${p.instanceId.slice(0, 8)}... | Started: ${new Date(p.startTime).toLocaleString()}
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${progress}%"></div>
            </div>
            <div class="task-list">
              ${p.tasks.map(t => `
                <div class="task-item">${ProcessService.formatTaskStatus(t)}</div>
              `).join('')}
            </div>
            ${p.status === 'RUNNING' ? `
              <button class="danger" style="margin-top: 8px; min-width: auto; flex: none;" 
                      onclick="cancelProcess('${p.instanceId}')">
                Cancel
              </button>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // Auto-refresh every 2 seconds if there are running processes
    setInterval(async () => {
      const hasRunning = Array.from(activeProcesses.values())
        .some(p => p.status === 'RUNNING');
      
      if (hasRunning) {
        await refreshProcesses();
      }
    }, 2000);

    // Initial log
    log('Process Engine Demo initialized', 'success');
    log('Click a button above to start a process!', 'info');
  </script>
</body>
</html>
